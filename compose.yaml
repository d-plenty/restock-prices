# Restock prices collector. In Dockge: + Compose, name it restock-prices, paste this, put
# GITHUB_TOKEN=…, HELPER_KEY=… and FEEDBACK_PASSWORD=… in the .env box, then Deploy. It waits and runs every Thursday at 1:00 am (Brisbane time), and
# again on Friday at 1:00 am only for a shop that failed or came back short. Every night at 3:00 am it adds the prices
# Restock phones sent back and publishes the day-one files again.
services:
  restock-prices:
    image: ghcr.io/d-plenty/restock-prices:latest
    container_name: restock-prices
    restart: unless-stopped
    environment:
      - TZ=Australia/Brisbane
      - SHOPS=woolworths,coles,aldi,costco   # Costco's website terms ask people not to collect its listings. Remove costco to leave it out.
      - RUN_DAY=thu
      - RUN_TIME=01:00
      - RETRY_DAY=fri
      - DELAY_MS=1500                        # pause between requests to a shop, in milliseconds
      - GIT_REPO=d-plenty/restock-prices
      - GITHUB_TOKEN=${GITHUB_TOKEN}         # in Dockge's .env box: a fine-grained token, this repo only, Contents read and write
      - HELPER_KEY=${HELPER_KEY}             # in Dockge's .env box: any long password, typed into the price helper phone too
      - HELPER_PORT=8790
      - FEEDBACK_PASSWORD=${FEEDBACK_PASSWORD}    # in Dockge's .env box: the password for /feedback/inbox
    ports:
      - "8790:8790"                          # the price helper phone, prices Restock phones send back, and feedback (behind your reverse proxy)
    volumes:
      - restock-prices-data:/data
volumes:
  restock-prices-data: null
